name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apfc-notes/package-lock.json
      - run: npm ci --include=dev
      - run: npm ci --prefix apfc-notes --include=dev
      - run: npm test --workspaces --if-present
      - run: npm run build
