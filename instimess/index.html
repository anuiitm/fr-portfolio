<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InstiMess: IIT Madras mess menus</title>
  <meta name="description" content="Today's hostel mess menu at IIT Madras for every mess and diet, with the meal being served right now highlighted.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#7e2018">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237e2018'/%3E%3Cpath d='M9 7v8a3 3 0 0 0 6 0V7M12 7v18M21 7c-2 2-2 8 0 9v9' fill='none' stroke='%23ffc107' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    try { var t = localStorage.getItem('instimess:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div>
        <h1>InstiMess</h1>
        <p class="tagline">IIT Madras hostel mess menus</p>
      </div>
      <button type="button" class="theme" id="theme" aria-label="Switch theme"></button>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="picker" aria-label="Choose a menu">
      <div class="pick-row">
        <span class="pick-label" id="mess-label">Mess</span>
        <div class="chips" id="mess" role="group" aria-labelledby="mess-label"></div>
      </div>
      <div class="pick-row" id="diet-wrap">
        <span class="pick-label" id="diet-label">Diet</span>
        <div class="chips" id="diet" role="group" aria-labelledby="diet-label"></div>
      </div>
    </section>

    <nav class="day-nav" aria-label="Choose a day">
      <button type="button" class="step" id="prev" aria-label="Previous day">‹</button>
      <label class="date">
        <span class="sr-only">Date</span>
        <input type="date" id="date">
        <span class="date-text" id="date-text" aria-hidden="true"></span>
      </label>
      <button type="button" class="step" id="next" aria-label="Next day">›</button>
      <button type="button" class="today" id="today">Today</button>
    </nav>

    <p class="context" id="context" aria-live="polite"></p>
    <div class="meals" id="meals"></div>
  </main>

  <footer class="foot wrap">
    <p>Menus follow the four-week rotation (weeks A–D) that began on 28 July 2024. Use ← and → to move between days.</p>
  </footer>

  <template id="meal-tpl">
    <article class="meal">
      <header class="meal-head">
        <h2></h2>
      </header>
      <ul class="dishes"></ul>
      <details class="common">
        <summary>Served every day</summary>
        <ul></ul>
      </details>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
